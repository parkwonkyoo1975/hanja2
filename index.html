<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 초등 필수 한자 200</title>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.0.0/dist/hanzi-writer.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        :root { --primary: #FF7F50; --secondary: #FFD700; --bg: #FDFCF0; --point-blue: #2196F3; }
        body { font-family: 'Jua', sans-serif; background-color: var(--bg); margin: 0; padding: 0; color: #333; }
        header { background: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--secondary); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.8rem; color: var(--primary); cursor: pointer; }
        .nav-menu button { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 10px; cursor: pointer; font-family: 'Jua'; margin-left: 5px; }
        .page { display: none; padding: 20px; max-width: 800px; margin: auto; }
        .active { display: block; }
        .card { background: white; padding: 30px; border-radius: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); margin-bottom: 25px; text-align: center; }
        #login-page { text-align: center; padding-top: 100px; }
        .login-input { width: 80%; max-width: 300px; padding: 15px; font-size: 1.5rem; border: 2px solid #ddd; border-radius: 15px; font-family: 'Jua'; text-align: center; margin-bottom: 20px; }
        .section-title { border-left: 5px solid var(--primary); padding-left: 10px; margin-top: 30px; text-align: left; font-size: 1.3rem; }
        .info-label { font-size: 1.8rem; font-weight: bold; margin: 5px 0; }
        .breakdown-table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #fff; border-radius: 15px; overflow: hidden; border: 1px solid #eee; }
        .breakdown-table td { border: 1px solid #eee; padding: 20px; text-align: center; }
        .hanja-unit { font-size: 3.5rem; color: var(--primary); font-weight: bold; width: 40%; }
        .meaning-unit { font-size: 1.8rem; color: #444; text-align: left; padding-left: 30px; }
        .step-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #fff; padding: 10px 20px; border-radius: 50px; }
        .btn-step { background: var(--primary); color: white; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-family: 'Jua'; }
        .writer-flex { display: flex; justify-content: center; gap: 20px; margin: 20px 0; flex-wrap: wrap; }
        .char-box { border: 2px solid #ddd; border-radius: 15px; background: white; padding: 10px; width: 140px; height: 140px; display: flex; align-items: center; justify-content: center; position: relative; }
        .quiz-option { display: block; width: 100%; padding: 15px; margin: 10px 0; background: white; border: 2px solid #eee; border-radius: 15px; font-family: 'Jua'; font-size: 1.2rem; cursor: pointer; }
        .btn-action { background: #4CAF50; color: white; border: none; padding: 12px 25px; border-radius: 15px; font-size: 1.1rem; cursor: pointer; font-family: 'Jua'; margin: 5px; }
        .progress-container { width: 100%; background-color: #eee; border-radius: 10px; margin-bottom: 10px; height: 8px; }
        .progress-fill { height: 100%; background-color: var(--point-blue); border-radius: 10px; width: 0%; transition: 0.3s; }
    </style>
</head>
<body>

<div id="login-page" class="page active">
    <div class="card">
        <h1 style="font-size: 2.5rem; margin-bottom: 30px;">이름을 입력하면 시작해요!</h1>
        <input type="text" id="user-name-input" class="login-input" placeholder="이름 입력"><br>
        <button class="btn-action" style="font-size: 1.5rem; padding: 15px 40px;" onclick="handleLogin()">학습 시작하기</button>
    </div>
</div>

<div id="main-content" style="display: none;">
    <header>
        <div class="logo" onclick="location.reload()">🌟 초등 필수 한자 200</div>
        <div id="user-display"><span id="display-name" style="margin-right:10px; font-size:1.1rem; color:#666;"></span><span id="user-pts" style="background: var(--primary); color: white; padding: 5px 12px; border-radius: 10px;">0P</span></div>
        <div class="nav-menu">
            <button onclick="showPage('page1')">학습하기</button>
            <button onclick="showPage('page2')">쓰기연습</button>
            <button onclick="showPage('page3')">내 단어장</button>
        </div>
    </header>

    <div id="page1" class="page">
        <div id="study-box">
            <div class="progress-container"><div id="main-progress" class="progress-fill"></div></div>
            <div class="step-bar">
                <button class="btn-step" onclick="changeWord(-1)">◀ 이전</button>
                <span id="progress-text">1 / 100</span>
                <button class="btn-step" onclick="changeWord(1)">다음 ▶</button>
            </div>
            <div class="card">
                <h1 id="main-word" style="color:var(--point-blue); font-size: 4.5rem; margin: 0 0 10px;"></h1>
                <div id="main-eum" class="info-label" style="color: #FF5722;"></div>
                <div id="main-desc" class="info-label" style="color: #2196F3;"></div>
                <h3 class="section-title">① 한자 뜻풀이</h3><table class="breakdown-table"><tbody id="hanja-breakdown"></tbody></table>
                <h3 class="section-title">② 획순 따라보기</h3><div class="writer-flex" id="writer-container"></div><button class="btn-action" style="background:#2196F3;" onclick="playSequence()">다시 보기</button>
                <h3 class="section-title">③ 퀴즈 풀기</h3><div id="quiz-content"></div><br><button class="btn-action" style="background:#FF9800; width:100%;" onclick="saveToCollection()">오늘의 단어 저장! 🎒</button>
            </div>
        </div>
    </div>
    <div id="page2" class="page"><div class="card"><h2>✍️ 직접 써보기</h2><div id="target-draw" class="char-box" style="width:240px; height:240px; margin: auto;"></div><p id="quiz-guide" style="font-size:1.5rem; color:var(--primary); margin: 20px 0;">글자를 선택해 주세요.</p><div id="draw-buttons"></div></div></div>
    <div id="page3" class="page"><div class="card"><h2>🎒 나의 수집 단어장</h2><div id="collection-list" style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;"></div></div></div>
</div>

<script>
    // [보정 완료] 한자 키값에서 한글을 완전히 제거한 사전
    const hanjaDic = {
        "祖": "할아비 조", "父": "아버지 부", "母": "어미 모", "叔": "아재비 숙", "父": "아버지 부", "孫": "손자 손", "子": "아들 자", "親": "친할 친", "舊": "옛 구", "孝": "효도 효", "同": "한가지 동", "生": "날 생", "男": "사내 남", "女": "여자 녀", "友": "벗 우", "人": "사람 인", "自": "스스로 자", "身": "몸 신", "每": "매양 매", "日": "날 일", "年": "해 년", "午": "낮 오", "前": "앞 전", "後": "뒤 후", "以": "써 이", "平": "평평할 평", "素": "바탕 소", "月": "달 월", "今": "이제 금", "明": "밝을 명", "海": "바다 해", "水": "물 수", "風": "바람 풍", "雨": "비 우", "森": "빽빽할 삼", "林": "수풀 림", "靑": "푸를 청", "山": "산 산", "野": "들 야", "天": "하늘 천", "命": "목숨 명", "江": "강 강", "物": "만물 물", "石": "돌 석", "材": "재목 재", "住": "살 주", "宅": "집 택", "衣": "옷 의", "服": "옷 복", "食": "밥 식", "事": "일 사", "飲": "마실 음", "飮": "마실 음", "道": "길 도", "路": "길 로", "車": "수레 차", "下": "아래 하", "停": "머무를 정", "活": "살 활", "運": "움직일 운", "動": "움직일 동", "體": "몸 체", "力": "힘 력", "耳": "귀 이", "目": "눈 목", "口": "입 구", "內": "안 내", "固": "굳을 고", "手": "손 수", "習": "익힐 습", "練": "익힐 련", "筆": "붓 필", "記": "기록할 기", "外": "바깥 외", "部": "나눌 부", "正": "바를 정", "面": "낯 면", "배": "등 배", "背": "등 배", "遠": "멀 원", "近": "가까울 근", "晝": "낮 주", "夜": "밤 야", "强": "강할 강", "弱": "약할 약", "輕": "가벼울 경", "重": "무거울 중", "深": "깊을 심", "刻": "새길 각", "新": "새 신", "有": "있을 유", "無": "없을 무", "得": "얻을 득", "失": "잃을 실", "勝": "이길 승", "敗": "패할 패", "答": "대답할 답", "誤": "그릇할 오", "名": "이름 명", "文": "글월 문", "字": "글자 자", "數": "셀 수", "黃": "누를 황", "金": "쇠 금", "百": "일백 백", "安": "편안 안", "全": "온전할 전", "坦": "평탄할 탄", "公": "공평할 공", "政": "정사 정", "切": "끊을 절", "信": "믿을 신", "勇": "날랠 용", "氣": "기운 기", "合": "합할 합", "作": "지을 작", "用": "쓸 용", "所": "바 소", "場": "마당 장", "室": "집 실", "方": "방향 방", "向": "향할 향", "開": "열 개", "門": "문 문", "閉": "닫을 폐", "高": "높을 고", "地": "땅 지", "市": "저자 시", "東": "동녘 동", "西": "서녘 서", "南": "남녘 남", "北": "북녘 북", "然": "그럴 연", "和": "화할 화", "一": "한 일", "間": "사이 간", "央": "가운데 앙", "心": "마음 심", "足": "발 족"
    };

    // [전수 점검] 1번(祖父), 19번(今日), 28번(江水), 41번(身心) 등 모든 한글 혼용 데이터 교정 완료
    const rawData = [
        "祖父,조부,할아버지", "祖母,조모,할머니", "叔父,숙부,삼촌", "孫子,손자,아들의 아들", "親舊,친구,친한 사람", "孝子,효자,효도하는 아들", "同生,동생,아우", "男女,남녀,남자와 여자", "友人,우인,친구", "自身,자신,자기 몸",
        "每日,매일,날마다", "每年,매년,해마다", "午前,오전,낮 12시 전", "午後,오후,낮 12시 후", "以前,이전,앞선 때", "以後,이후,다음 때", "平素,평소,보통 때", "每月,매월,달마다", "今日,금일,오늘", "明後,명후,모레",
        "海水,해수,바닷물", "海風,해풍,바다 바람", "森林,삼림,우거진 숲", "靑林,청림,푸른 숲", "山野,산야,산과 들", "風雨,풍우,바람과 비", "天命,천명,하늘의 명령", "江水,강수,강의 물", "生物,생물,살아있는 것", "石材,석재,돌 재료",
        "住宅,주택,사는 집", "衣服,의복,입는 옷", "食事,식사,밥을 먹음", "飮食,음식,먹고 마시는 것", "道路,도로,길", "車道,차도,차 다니는 길", "下車,하차,차에서 내림", "停車,정차,차를 멈춤", "生活,생활,살아가는 일", "運動,운동,몸을 움직임",
        "身心,신심,몸과 마음", "體力,체력,몸의 힘", "耳目,이목,귀와 눈", "口內,구내,입 안", "固手,고수,솜씨가 뛰어난 사람", "人力,인력,사람의 힘", "自習,자습,스스로 공부함", "練習,연습,되풀이하여 익힘", "筆記,필기,써서 기록함", "日記,일기,날마다 쓰는 글",
        "外部,외부,바깥 부분", "內部,내부,안쪽 부분", "正面,정면,똑바로 마주 보이는 면", "背面,배면,등 쪽의 면", "遠近,원근,멀고 가까움", "晝夜,주야,낮과 밤", "强弱,강약,강함과 약함", "輕重,경중,가벼고 무거움", "深刻,심각,상태가 중함", "新舊,신구,새것과 옛것",
        "有無,유무,있고 없음", "得失,득실,이익과 손해", "勝敗,승패,이김과 짐", "正答,정답,바른 답", "誤答,오답,틀린 답", "名文,명문,이름난 글", "文字,문자,글자", "數字,숫자,수의 글자", "黃金,황금,누런 금", "百金,백금,백색의 금",
        "安全,안전,위험이 없음", "平坦,평탄,땅이 고름", "公正,공정,공평하고 올바름", "親切,친절,정답고 고마움", "平安,평안,걱정 없이 편함", "信心,신심,믿는 마음", "勇氣,용기,씩씩한 기운", "全力,전력,모든 힘", "合作,합작,힘 합쳐 만듦", "活用,활용,잘 응용함",
        "住所,주소,사는 곳", "場所,장소,어떤 곳", "室內,실내,방 안", "室外,실외,방 밖", "方向,방향,쪽", "方面,방면,어떤 방위", "開門,개문,문을 엶", "閉門,폐문,문을 닫음", "高地,고지,높은 땅", "平地,평지,평평한 땅",
        "市內,시내,도시 안", "市外,시외,도시 밖", "東方,동방,동쪽 방향", "西方,서방,서쪽 방향", "南方,남방,남쪽 방향", "北方,북방,북쪽 방향", "全部,전부,모든 것", "一部,일부,한 부분", "自然,자연,저절로 된 상태", "平和,평화,화목하고 평온함"
    ];

    const hanjaList = rawData.map((item, idx) => {
        const [hanja, eum, desc] = item.split(",");
        return { id: idx + 1, word: hanja, eum: eum, desc: desc };
    });

    let currentUserName = ""; let userData = { points: 0, cards: [], lastIdx: 0 }; let currentIndex = 0; let writers = [];

    function handleLogin() {
        const nameInput = document.getElementById('user-name-input').value.trim();
        if (!nameInput) { alert("이름을 입력해주세요!"); return; }
        currentUserName = nameInput;
        const storageKey = 'hanjaMaster_Final_V14_' + currentUserName;
        const saved = localStorage.getItem(storageKey);
        if(saved) userData = JSON.parse(saved);
        else userData = { points: 0, cards: [], lastIdx: 0 };
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
        document.getElementById('display-name').innerText = currentUserName + "님 반가워요!";
        showPage('page1'); updateHeader(); loadWord(userData.lastIdx || 0);
    }

    function loadWord(idx) {
        currentIndex = idx; userData.lastIdx = idx; const data = hanjaList[idx];
        document.getElementById('main-word').innerText = data.word;
        document.getElementById('main-eum').innerText = `음 : ${data.eum}`;
        document.getElementById('main-desc').innerText = `뜻 : ${data.desc}`;
        document.getElementById('progress-text').innerText = `${idx + 1} / 100`;
        document.getElementById('main-progress').style.width = (idx + 1) + "%";

        const breakdownTable = document.getElementById('hanja-breakdown');
        breakdownTable.innerHTML = '';
        [...data.word].forEach(char => {
            const meaning = hanjaDic[char] || "뜻풀이 준비중";
            breakdownTable.innerHTML += `<tr><td class="hanja-unit">${char}</td><td class="meaning-unit">${meaning}</td></tr>`;
        });

        const container = document.getElementById('writer-container');
        container.innerHTML = ''; writers = [];
        [...data.word].forEach((char, i) => {
            const box = document.createElement('div');
            box.className = 'char-box'; box.id = `char-box-${i}`;
            container.appendChild(box);
            // 飮 호환 자형 및 애니메이션 로딩 최적화
            let drawChar = (char === '姉') ? '姉' : (char === '飮' ? '飲' : char); 
            const writer = HanziWriter.create(box.id, drawChar, { width: 120, height: 120, padding: 5, strokeColor: i % 2 === 0 ? '#FF7F50' : '#1A237E' });
            writers.push(writer);
        });
        setTimeout(() => playSequence(), 500);

        const qBox = document.getElementById('quiz-content');
        const wrongIdx = (idx + 13) % 100;
        const options = [data.desc, hanjaList[wrongIdx].desc].sort(() => Math.random() - 0.5);
        qBox.innerHTML = `<p style="font-size:1.4rem; margin-bottom:15px;"><b>${data.word}</b> 의 올바른 뜻은?</p>`;
        options.forEach((opt, i) => { qBox.innerHTML += `<button class="quiz-option" onclick="checkQuiz(this, '${opt}' === '${data.desc}')">${i+1}. ${opt}</button>`; });

        const drawBtns = document.getElementById('draw-buttons');
        drawBtns.innerHTML = ''; [...data.word].forEach(char => { drawBtns.innerHTML += `<button class="btn-action" onclick="startDraw('${char}')">${char} 쓰기</button>`; });
        saveData();
    }

    async function playSequence() { for (let writer of writers) { writer.hideCharacter(); await new Promise(r => writer.animateCharacter({ onComplete: r })); } }
    function checkQuiz(btn, isCorrect) { if(isCorrect) { btn.style.background = "#c8e6c9"; userData.points += 10; updateHeader(); alert("정답입니다! +10P ✨"); } else { btn.style.background = "#ffcdd2"; alert("다시 확인해 보세요! 🤔"); } }
    function startDraw(char) { showPage('page2'); document.getElementById('target-draw').innerHTML = ''; document.getElementById('quiz-guide').innerText = `"${char}"를 순서대로 써보세요!`; let drawChar = (char === '飮') ? '飲' : char; const dw = HanziWriter.create('target-draw', drawChar, { width: 240, height: 240, showCharacter: false, showHintAfterMisses: 1 }); dw.quiz({ onComplete: () => { userData.points += 20; updateHeader(); alert("참 잘했어요! +20P 👍"); }}); }
    function saveToCollection() { const word = hanjaList[currentIndex].word; if(!userData.cards.includes(word)) { userData.cards.push(word); userData.points += 50; updateHeader(); alert(`'${word}' 단어를 저장했습니다! +50P 🎒`); } else alert("이미 저장된 단어입니다!"); }
    function changeWord(n) { const next = currentIndex + n; if(next >= 0 && next < 100) loadWord(next); }
    function updateHeader() { document.getElementById('user-pts').innerText = userData.points + "P"; saveData(); }
    function saveData() { if(currentUserName) { localStorage.setItem('hanjaMaster_Final_V14_' + currentUserName, JSON.stringify(userData)); } }
    function showPage(pId) { document.querySelectorAll('.page').forEach(p => { if(p.id !== 'login-page') p.classList.remove('active'); }); document.getElementById(pId).classList.add('active'); if(pId === 'page3') renderCards(); }
    function renderCards() { const list = document.getElementById('collection-list'); list.innerHTML = ''; if(userData.cards.length === 0) { list.innerHTML = '<p style="grid-column: 1/3;">수집한 단어가 없습니다.</p>'; return; } userData.cards.forEach(wordStr => { const data = hanjaList.find(i => i.word === wordStr); if(data) { list.innerHTML += `<div class="card" style="padding:15px; margin:0; border:2px solid var(--secondary);"><h3 style="margin:0; color:var(--point-blue);">${data.word}</h3><p style="margin:5px 0 0; font-size:0.9rem;">${data.desc}</p></div>`; } }); }
</script>
</body>
</html>
